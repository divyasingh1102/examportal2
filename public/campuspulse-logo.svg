<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00236f" />
      <stop offset="60%" stop-color="#0051d5" />
      <stop offset="100%" stop-color="#316bf3" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbe1ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#cpGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#90a8ff" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Graduation Cap (Academic Symbol) -->
  <!-- Cap Diamond Top -->
  <path d="M32 14L48 21L32 28L16 21L32 14Z" fill="url(#capGrad)" />
  
  <!-- Cap Skull Base -->
  <path d="M21 24.5V30.5C21 34 25.5 37 32 37C38.5 37 43 34 43 30.5V24.5L32 29.5L21 24.5Z" fill="#b4c5ff" />
  
  <!-- Tassel -->
  <path d="M44 23V34C44 35 45 36 46 36C47 36 48 35 48 34V23" stroke="#ffddb8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="48" cy="35" r="1.5" fill="#ffb95f" />

  <!-- Pulse Line (Intelligence & Vitality Waveform) -->
  <path
    d="M14 47H24L28 41L32 53L36 39L40 47H50"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active Pulse Beacon Dot -->
  <circle cx="36" cy="39" r="2.5" fill="#10b981" />
  <circle cx="36" cy="39" r="4.5" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
</svg>
